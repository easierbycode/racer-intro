name: Check social credentials

# Answers "are the posting secrets still good?" in a few seconds — no
# Chrome, no ffmpeg, no recording, nothing published. Run it after rotating
# a token, or when a Record scene run fails at the posting step and you want
# to know whether the credentials or the pipeline is at fault.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'which credentials to check'
        type: choice
        options: [instagram, tiktok, both]
        default: both

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PLATFORM: ${{ github.event.inputs.platform || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Each platform runs in its own `if` so checking "both" reports on
      # TikTok even when Instagram is the one that's broken.
      - name: Instagram
        if: ${{ github.event.inputs.platform != 'tiktok' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: deno task post --platform instagram --check

      - name: TikTok
        if: ${{ always() && github.event.inputs.platform != 'instagram' }}
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: deno task post --platform tiktok --check
